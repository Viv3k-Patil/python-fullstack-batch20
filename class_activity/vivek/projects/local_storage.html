
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather, Map and POST API</title>
</head>
<body>
  <h2>Weather App</h2>

  <input type="text" id="myInput" placeholder="Enter city name..." />
  <button id="saveBtn">Get Weather</button>

  <p id="message"></p>
  <div id="weather"></div>

  <h3>City Map</h3>
  <iframe
    id="map"
    width="100%"
    height="350"
    style="border: 1px solid #ccc"
    src="https://www.openstreetmap.org/export/embed.html?bbox=73.75%2C18.45%2C73.95%2C18.65&layer=mapnik"
    title="City map"
  ></iframe>

  <hr />

  <h2>Create a Post</h2>

  <form id="postForm">
    <p>
      <label for="postTitle">Title:</label><br />
      <input
        type="text"
        id="postTitle"
        placeholder="Enter post title"
        required
      />
    </p>

    <p>
      <label for="postBody">Description:</label><br />
      <textarea
        id="postBody"
        placeholder="Enter post description"
        rows="4"
        required
      ></textarea>
    </p>

    <button type="submit" id="postBtn">Create Post</button>
  </form>

  <p id="postMessage"></p>
  <div id="postResult"></div>

  <script>
    const input = document.getElementById("myInput");
    const button = document.getElementById("saveBtn");
    const message = document.getElementById("message");
    const weather = document.getElementById("weather");
    const map = document.getElementById("map");

    // Restore saved city
    input.value = localStorage.getItem("myValue") || "";

    // GET request: Fetch weather
    button.addEventListener("click", async () => {
      const city = input.value.trim();

      if (!city) {
        message.textContent = "Please enter a city name.";
        return;
      }

      localStorage.setItem("myValue", city);
      message.textContent = "Loading weather...";
      weather.replaceChildren();

      try {
        const geoResponse = await fetch(
          `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
        );

        if (!geoResponse.ok) {
          throw new Error("Could not find city.");
        }

        const geoData = await geoResponse.json();

        if (!geoData.results?.length) {
          throw new Error("City not found.");
        }

        const location = geoData.results[0];
        const { latitude, longitude, name, country } = location;

        const weatherResponse = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code`
        );

        if (!weatherResponse.ok) {
          throw new Error("Could not fetch weather.");
        }

        const data = await weatherResponse.json();
        const current = data.current;

        weather.innerHTML = `
          <h3>${name}, ${country || ""}</h3>
          <p>Temperature: ${current.temperature_2m} °C</p>
          <p>Feels like: ${current.apparent_temperature} °C</p>
          <p>Humidity: ${current.relative_humidity_2m}%</p>
          <p>Wind speed: ${current.wind_speed_10m} km/h</p>
          <p>Weather code: ${current.weather_code}</p>
        `;

        const delta = 0.08;
        const bbox = [
          longitude - delta,
          latitude - delta,
          longitude + delta,
          latitude + delta
        ].join("%2C");

        map.src =
          `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${latitude}%2C${longitude}`;

        message.textContent = "Weather loaded successfully!";
      } catch (error) {
        message.textContent = error.message;
      }
    });

    // POST request: Create a post
    const postForm = document.getElementById("postForm");
    const postMessage = document.getElementById("postMessage");
    const postResult = document.getElementById("postResult");
    const postBtn = document.getElementById("postBtn");

    postForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const title = document.getElementById("postTitle").value.trim();
      const body = document.getElementById("postBody").value.trim();

      if (!title || !body) {
        postMessage.textContent = "Please fill in both fields.";
        return;
      }

      postBtn.disabled = true;
      postMessage.textContent = "Submitting post...";
      postResult.replaceChildren();

      try {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/posts",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              title: title,
              body: body,
              userId: 1
            })
          }
        );

        if (!response.ok) {
          throw new Error("Failed to create post.");
        }

        const data = await response.json();

        postMessage.textContent = "Post submitted successfully!";

        // Display the API response safely
        const heading = document.createElement("h3");
        heading.textContent = "API Response";

        const id = document.createElement("p");
        id.textContent = "Post ID: " + data.id;

        const resultTitle = document.createElement("p");
        resultTitle.textContent = "Title: " + data.title;

        const resultBody = document.createElement("p");
        resultBody.textContent = "Description: " + data.body;

        postResult.append(heading, id, resultTitle, resultBody);

      } catch (error) {
        postMessage.textContent = error.message;
      } finally {
        postBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
